    <div id="fixed-footer" style="position:fixed;bottom:0;left:0;width:100%;background:#111;padding:10px;text-align:center;z-index:99999;font-family:sans-serif;font-size:13px;transition:opacity 0.3s;">
      <a href="https://planificadortareas.lovable.app/uso.html" rel="privacy-policy" style="color:#aaa;text-decoration:underline;margin-right:16px;">Política de Privacidad</a>
      <span style="color:#555">·</span>
      <a href="https://planificadortareas.lovable.app/uso.html" rel="privacy-policy" style="color:#aaa;text-decoration:underline;margin-left:16px;">Términos de Servicio</a>
    </div>
    <script>
      (function(){
        var footer = document.getElementById('fixed-footer');
        function checkVisibility(){
          var el = document.scrollingElement || document.documentElement;
          var atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
          var pageShort = el.scrollHeight <= el.clientHeight + 100;
          var bottomNav = document.querySelector('nav.fixed.bottom-0');
          var privacyFooter = document.querySelector('[data-privacy-footer]');
          var privacyVisible = false;
          if (privacyFooter) {
            var rect = privacyFooter.getBoundingClientRect();
            privacyVisible = rect.top < window.innerHeight && rect.bottom > 0;
          }
          // Hide if bottom nav exists, or if privacy footer visible, or at page bottom
          var hide = !!bottomNav || privacyVisible || (atBottom && !pageShort);
          footer.style.opacity = hide ? '0' : '1';
          footer.style.pointerEvents = hide ? 'none' : 'auto';
        }
        window.addEventListener('scroll', checkVisibility, true);
        setInterval(checkVisibility, 500);
      })();
    </script>
    <div id="root"></div>
